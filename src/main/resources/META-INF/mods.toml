# Floating Text 模组元数据（版本号等占位符由 Gradle 构建时自动替换）

modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
logoFile="logo.png"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''Place editable floating text in the world, with native font rendering, save support and multiplayer sync.'''

# 依赖：必须运行在 Forge 上（版本范围见 gradle.properties）
[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

# 依赖：必须是 Minecraft 1.20.1
[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
